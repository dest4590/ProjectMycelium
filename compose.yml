services:
  neo4j:
    image: neo4j:5-community
    container_name: mycelium-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/123123123

    volumes:
      - ./neo4j_data:/data

  backend:
    build: .
    container_name: mycelium-backend
    restart: unless-stopped
    ports:
      - "8971:8080"
    env_file:
      - .env
    environment:
      SPRING_NEO4J_URI: neo4j://neo4j:7687
    depends_on:
      - neo4j
    volumes:
      - ./insta_cookies_main.json:/app/insta_cookies_main.json