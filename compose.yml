services:
  neo4j:
    image: neo4j:5-community
    container_name: mycelium-neo4j
    restart: unless-stopped

    ports:
      - "7474:7474"
      - "7687:7687"

    environment:
      NEO4J_AUTH: neo4j/123123123

    volumes:
      - ./neo4j_data:/data

    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "123123123", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: mycelium-backend
    restart: unless-stopped
    ports:
      - "8971:8080"
    env_file:
      - .env
    environment:
      SPRING_NEO4J_URI: neo4j://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./insta_cookies_main.json:/app/insta_cookies_main.json